<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self'">
<title>Agent 全局系统大地图</title>
<style>
:root{--bg:#f2f5f5;--surface:#fff;--ink:#17242a;--muted:#617179;--line:#d5dfe0;--soft:#e8f0f0;--teal:#086f70;--green:#287752;--amber:#956616;--red:#a53e35;--blue:#336e94}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:13px 20px}h1{margin:0;font-size:20px;line-height:1.25}.meta{margin-top:4px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 68px)}nav{position:sticky;top:68px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}nav a{display:inline-block;padding:6px 10px;border-bottom:2px solid transparent;color:var(--ink);font-size:12.5px;text-decoration:none}nav a:hover,nav a:focus{border-bottom-color:var(--teal);background:#eef6f6;outline:none}nav .external{margin-left:auto;border:0;border-left:1px solid var(--line);padding-left:12px;color:var(--blue)}main{min-width:0;padding:20px;max-width:1800px}.panel{margin-bottom:16px;padding:17px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.panel h2{margin:0;font-size:17px;line-height:1.35}.panel h3{margin:18px 0 7px;font-size:14px}.sub,.note{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:11px}.metric{font-size:24px;font-weight:700;color:var(--teal)}.card{min-width:0;padding:11px;border:1px solid var(--line);border-radius:6px;background:#fbfcfc}.badge{display:inline-block;margin:8px 0 0;padding:1px 7px;border-radius:10px;background:#e9efef;color:var(--teal);font-size:11px}.badge.gated{color:var(--red);background:#f9e9e7}.badge.declared,.badge.partial{color:var(--amber);background:#faf0dc}.badge.documented{color:var(--green);background:#e9f4ed}.evidence{margin-top:11px;padding:8px 10px;border-left:3px solid var(--teal);background:#f4f8f8;color:var(--muted);font-size:12px}.scroll{max-height:470px;overflow:auto;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafb;color:var(--muted);font-weight:600}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.toolbar input,.toolbar select{min-width:190px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}code{font-family:Consolas,monospace;font-size:11.5px}.external-panel{border-style:dashed;border-color:var(--blue)}.topology-note{margin:10px 0 0;color:var(--muted);font-size:12px}.system-map{position:relative;margin-top:14px;padding:16px;border:1px solid #bbcfd0;border-radius:7px;background:#f9fcfc}.site-label{margin-bottom:8px;color:var(--muted);font-size:12px;text-align:center}.root-node{position:relative;z-index:1;max-width:310px;margin:0 auto 20px;padding:10px 14px;border:1px solid var(--teal);background:#fff;text-align:center;font-weight:700}.root-node span{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:400}.topology-grid{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:12px;position:relative}.topology-grid:before{content:"";position:absolute;top:-11px;left:8%;right:8%;height:1px;background:#93aeb0}.topology-column{position:relative;min-width:0}.topology-column:before{content:"";position:absolute;top:-11px;left:50%;height:11px;border-left:1px solid #93aeb0}.map-node{min-height:61px;padding:8px;border:1px solid #afc2c3;background:#fff;text-align:center;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}.map-node small{display:block;color:var(--muted);font-size:10px;font-weight:400}.map-node.guardian{border-color:var(--red);background:#fffafa;color:#6f2720}.map-node.beads{border-color:var(--teal);color:var(--teal)}.map-node.desktop{border-color:var(--blue);color:var(--blue)}.flow-label{margin:5px 0;color:var(--muted);font-size:10px;text-align:center}.map-children{margin-top:7px;padding:7px 5px;border-top:1px dashed #b6c7c8;color:var(--muted);font-size:10.5px;line-height:1.45}.map-children div{padding:2px 0}.desktop-link{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:center;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.desktop-arrow{border-top:1px dashed var(--blue);color:var(--blue);font-size:12px;text-align:right}.desktop-arrow:after{content:"  ↝"}.desktop-portal{padding:10px;border:1px dashed var(--blue);background:#fbfdff;text-align:center}.desktop-portal a{color:var(--blue);font-weight:700;text-decoration:none}.desktop-portal small{display:block;color:var(--muted);font-weight:400}.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:11px}.section-link{color:var(--teal);text-decoration:none;font-weight:600}.section-link:hover{text-decoration:underline}@media(max-width:1080px){.topology-grid{grid-template-columns:repeat(3,minmax(180px,1fr))}.topology-grid:before{display:none}.topology-column:before{display:none}}@media(max-width:800px){header{position:relative;padding:12px}.layout{grid-template-columns:1fr}nav{position:relative;top:0;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav a{flex:0 0 auto;padding:8px 11px;border-left:0;border-bottom:3px solid transparent}nav a:hover,nav a:focus{border-left:0;border-bottom-color:var(--teal)}main{padding:12px}.panel{padding:13px}.topology-grid{grid-template-columns:1fr}.desktop-link{grid-template-columns:1fr;gap:8px}.desktop-arrow{text-align:center}.three-col{grid-template-columns:1fr}}
</style>
<style>

.tree-node.gated{border-color:var(--red);background:#fffafa;color:#6f2720}.tree-node.beads{border-color:var(--teal);color:var(--teal)}.tree-node.manager{border-color:#708fa7;background:#fbfdff}.tree-node.communication{border-style:dashed;border-color:var(--blue);color:var(--blue)}
.agent-preview{display:grid;gap:4px;margin-top:6px;text-align:left}.agent-interface{padding:4px;border-top:1px dashed #c4d2d3;font-size:9.5px;line-height:1.35}.agent-interface:first-child{border-top:0}.agent-interface b{font-size:10px}
.slot-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.slot-chip{min-width:25px;padding:1px 3px;border:1px solid #b9cacb;background:#f4f8f8;color:var(--teal);font:9px/1.35 Consolas,monospace;text-align:center}
.branch-ladder{display:grid;grid-template-columns:minmax(150px,310px);gap:5px;margin-top:10px}.branch-ladder .tree-node{text-align:left;padding-left:10px}
.family-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:11px}.family-block{min-width:0;padding:9px;border:1px solid var(--line);background:#fbfcfc;overflow-wrap:anywhere}.family-block h4{margin:0;font-size:12px}.family-block p{margin:3px 0;color:var(--muted);font-size:11px}.tree-node .family-grid{grid-template-columns:minmax(0,1fr)}.tree-node .family-block{padding:6px}
.desktop-stack{display:grid;gap:5px;margin-top:7px}.desktop-stack .tree-node{border-color:#aac0d0;background:#fff;text-align:center}
.node-link{display:block;text-decoration:none;color:inherit}
.node-link:hover .tree-node{border-color:var(--teal);box-shadow:0 1px 5px rgba(21,101,104,.18)}
.branch-badge{margin-top:7px;font-size:10px;color:var(--muted);text-align:center}

.domain-details{margin-top:8px}

.domain-strip{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:4px}

.live-strip{margin-top:10px}
.soak-bar{height:5px;background:#e6ecec;border-radius:3px;margin-top:6px;overflow:hidden}

@media(max-width:800px){.topology-grid{grid-template-columns:1fr}.branch-ladder{grid-template-columns:1fr}}
.asset-grid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.asset-tag{padding:0 6px;border-radius:8px;background:#e9efef;color:var(--teal);font-size:10.5px}
.asset-tag.tag-db{background:#eaf1f8;color:var(--blue)}
.asset-tag.tag-warn{background:#f9e9e7;color:var(--red)}
.asset-tag.tag-pend{background:#faf0dc;color:var(--amber)}

.asset-tag.tag-pilot{background:#eef0fb;color:#5a4fcf}
.asset-block{margin-top:8px;border-top:1px dashed var(--line);padding-top:5px}
.asset-head{font-size:11px;color:var(--muted);margin-bottom:2px}
.asset-group{margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.asset-sub2{width:100%;color:var(--muted);font-size:11px}
.asset-status{font-size:11px}
.asset-status.st-open{color:var(--blue)}
.asset-status.st-in_progress{color:var(--amber)}

.asset-row .ok{color:var(--green)}
.asset-row .no{color:var(--red)}
.l2-stack{margin:5px 0 2px 20px;padding-left:10px;border-left:2px solid var(--soft);display:grid;gap:5px}
/* E-36: 三级坐标分布总览（NAV 之上）——样式毛坯，总控美化 */
#coord-overview{margin:10px 12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
#coord-overview .co-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}

.co-grid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}

.co-l3-lbl{color:var(--teal);font-weight:600}
.co-l3-cts{color:var(--muted)}
.co-l3-item.co-meta{display:block;color:#5a6b6b;font-size:10px;border-top:1px dashed #e4ecec;padding-top:3px;margin-top:2px}
.co-note{margin-top:6px;color:var(--muted);font-size:10.5px}
@media(max-width:1280px){.co-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:800px){.co-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#coord-overview{margin:8px 8px 0}}
.l2-stack .tree-node{border-style:dashed}
.subnode-chip{font-size:10.5px;color:var(--teal);padding:2px 0 0 10px;text-align:left}
.l2-vstack{display:grid;gap:9px;margin-top:9px}
.panel.has-subnav{display:grid;grid-template-columns:172px minmax(0,1fr);gap:6px 14px}
.panel.has-subnav>h2,.panel.has-subnav>.sub{grid-column:1/-1}

</head><body>
<header><h1>Agent 全局系统大地图</h1><div class="meta" id="meta" data-as-of=""></div></header>
<div class="layout"><div id="coord-overview"></div><nav id="nav" aria-label="地图导航"></nav><main id="main"></main></div>
<script type="application/json" id="mapdata">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('mapdata').textContent), main=document.getElementById('main');
const U=D.uiMappings||{};const ANCHOR_ALIAS=U.anchors||{};const KINDTAG=U.kindTags||{};const TL=U.typeLabels||{};const GAPLBL=U.gapLabels||{};const SUBT=U.subdomainTitles||{};
// E-38 v2: 三级坐标分布总览渲染（NAV 之上；只读消费 D.coordOverview；L3 渲染铁律：挂 parent 缩进、可选覆盖、直属在前）
(function(){
  const ov=D.coordOverview;if(!ov||!ov.panels||!ov.panels.length)return;
  const TYPE_LBL={card:'卡',task:'任务',skill:'skill',mcp:'MCP',agent:'agent',slot:'工位',thread:'线程',memory:'记忆',standard:'标准',module:'模块卡'};
  const esc=window.esc||(s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'));
  const box=document.getElementById('coord-overview');
  const head=`<div class="co-head"><b>三级坐标分布总览</b><span>${esc(ov.meta?ov.meta.panels+' 面板 × '+ov.meta.subdomains+' 子域 / '+ov.meta.l3_classes+' L3 类':'')} · 各坐标位独立计数（空格=0，点击下钻）</span></div>`;
  const renderCounts=c=>Object.entries(c||{}).filter(([,v])=>v>0).map(([k,v])=>`<span class="ct">${TYPE_LBL[k]} ${v}</span>`).join('');
  const renderL3=(l3Arr)=>((l3Arr||[]).filter(g=>g.kind!=='meta').length?(l3Arr.filter(g=>g.kind!=='meta').map(g=>{
    const gc=g.counts||{};const gt=Object.keys(gc).filter(k=>gc[k]>0).map(k=>`${TYPE_LBL[k]} ${gc[k]}`).join(' ');
    return `<div class="co-l3-item"><span class="co-l3-lbl">${esc(g.label||g.id)}</span>${gt?`<span class="co-l3-cts">${gt}</span>`:''}</div>`;
  }).join('')):'');
  const renderMeta=(l3Arr)=>((l3Arr||[]).filter(g=>g.kind==='meta').map(g=>`<div class="co-l3-item co-meta">${esc(g.label||'')}</div>`).join(''));
  const renderCell=(p,s)=>{
    // 面板级格（subnode=None）显示该面板直接挂板块的对象（p.counts）；子域格显示直属（s.direct）
    // E-111 增补5：L3 独立成格平铺（co-l3cell），不嵌在子域格内
    const d=s.subnode?(s.direct||{}):(p.counts||{});const any=Object.values(d).some(v=>v>0);
    const l3Cells=((s.l3||[]).filter(g=>g.kind!=='meta').map(g=>{
      const gc=g.counts||{};const gt=Object.keys(gc).filter(k=>gc[k]>0).map(k=>`${TYPE_LBL[k]} ${gc[k]}`).join(' ');
      return `<div class="co-cell co-l3cell" data-sub="${esc(g.id||g.label||'')}"><span class="co-sub">${esc(g.label||g.id)}</span>${gt?`<div class="co-cts">${gt}</div>`:''}</div>`;
    }).join(''));
    if(!any&&!l3Cells)return `<div class="co-cell co-zero" data-sub="${esc(s.subnode||'')}"><span class="co-sub">${esc(SUBT[s.subnode]||s.subnode||'面板级')}</span><div class="co-cts">0</div></div>`;
    const cts=renderCounts(d);
    return `<div class="co-cell" data-sub="${esc(s.subnode||'')}" title="下钻: ${esc(SUBT[s.subnode]||s.subnode||'面板级')} @ ${esc(p.title)}"><span class="co-sub">${esc(SUBT[s.subnode]||s.subnode||'面板级')}</span>${cts?`<div class="co-cts">${cts}</div>`:''}${l3Cells?`<div class="co-l3">${l3Cells}</div>`:''}</div>`;
  };
  const cols=ov.panels.map(p=>{
    // search 面板：显示层用 overview_groups（线上/线下两组），子域格被聚合
    if(p.overview_groups&&p.overview_groups.length){
      const grpCells=p.overview_groups.map(g=>{
        const d=g.direct||{};const any=Object.values(d).some(v=>v>0);
        const l3=(g.l3||[]).map(t=>`<div class="co-cell co-l3cell" data-sub="${esc(t.id||t.label||'')}"><span class="co-sub">${esc(t.label||t.id)}</span><span class="co-cts">${t.count?`${t.count}`:''}</span></div>`).join('');
        return `<div class="co-cell" data-sub="${esc(g.id)}" title="下钻: ${esc(g.label)} @ ${esc(p.title)}"><span class="co-sub">${esc(g.label)}</span><span class="co-sub-note">（显示聚合，非归属包含）</span>${any?`<div class="co-cts">${renderCounts(d)}</div>`:''}${l3?`<div class="co-l3">${l3}</div>`:''}</div>`;
      }).join('');
      const meta=renderMeta(p.subnodes.flatMap(s=>s.l3||[]));
      return `<div class="co-col" data-panel="${esc(p.panel_id)}"><h4 title="${esc(p.title)}">${esc(p.display_number?p.display_number+' ':'')}${esc(p.title)}</h4>${grpCells}${meta}</div>`;
    }
    const subCells=p.subnodes.map(s=>renderCell(p,s)).join('');
    const meta=renderMeta(p.subnodes.flatMap(s=>s.l3||[]));
    return `<div class="co-col" data-panel="${esc(p.panel_id)}"><h4 title="${esc(p.title)}">${esc(p.display_number?p.display_number+' ':'')}${esc(p.title)}</h4>${subCells}${meta}</div>`;
  }).join('');
  const note=`<div class="co-note">计数来自权威源实时统计（资产注册表 l3_tool_class 实标/task-projection/skill-panel-mapping/MCP registry+挂载/agents.json/slot-registry/thread-center 注册表/总控1 台账）；各坐标位独立计数（L3 独立成格，不缩进嵌套）；空格子显示 0 为真实分布；MCP 守恒注于 mcp-manager 列。</div>`;

// 网页资产卡片（数据驱动：card 块字段存在才渲染，注册表可增删改）
function beadsRow(id,how){const t=taskById[id];if(!t)return `<div class="asset-row"><span class="asset-label">${esc(how)}</span><a href="#beads?q=${encodeURIComponent(id)}"><code>${esc(id)}</code></a><span class="sub">非活跃/已关闭</span></div>`;const dep=(D.taskDeps||{})[id]||{};const depInfo=[(dep.blockedBy||[]).length?`←${dep.blockedBy.length}`:'',(dep.blocking||[]).length?`→${dep.blocking.length}`:''].filter(Boolean).join(' ');return `<div class="asset-row"><span class="asset-label">${esc(how)}</span><a href="#beads?q=${encodeURIComponent(id)}"><code>${esc(id)}</code></a><span class="asset-status st-${esc(t.status)}">${esc(t.status)}</span><span class="sub">P${esc(t.priority)} · ${esc((t.lane||'—').replace(/^lane:/,''))}${depInfo?' · '+esc(depInfo):''}</span><span class="asset-sub2">${esc(t.title)}</span></div>`}
function assetCard(a){const c=a.card||{};
  const href=a.url?a.url:(a.local_path?('file:///'+String(a.local_path).replace(/\\/g,'/')):'');
  const title=href?`<a href="${esc(href)}" target="_blank" rel="noreferrer"><b>${esc(a.name)}</b></a>`:`<b>${esc(a.name)}</b>`;
  const numTag=a.map_number?`<span class="asset-tag tag-db">№ ${esc(a.map_number)}</span>`:'';
  const dacTag=a.data_asset_class?`<span class="asset-tag tag-dac" title="数字资产子类（taxonomy）">${esc(a.data_asset_class)}</span>`:'';
  const typeTag=`<span class="asset-tag${a.asset_type==='database'?' tag-db':''}">${TL[a.asset_type]||'资产'}</span>`;
  const flag=c.review_flag?`<span class="asset-tag tag-warn">⚠ ${esc(c.review_flag)}</span>`:'';
  const lc=a.lifecycle||null;
  const lcTag=lc?(lc.status==='managed'?'<span class="asset-tag tag-ok">正式</span>':(lc.status==='deprecated'?'<span class="asset-tag tag-warn">退役</span>':'<span class="asset-tag tag-pilot">🧪 实验</span>')):'';
  const gapRow=(lc&&lc.status==='pilot'&&(lc.gaps||[]).length)?`<div class="asset-row"><span class="asset-label">毕业缺口</span><span>${lc.gaps.map(g=>`<span class="asset-tag tag-pend">${esc(GAPLBL[g]||g)}</span>`).join(' ')}</span></div>`:'';
  const links=[];
  if(a.dashboard_path)links.push("<a href=\"file:///" + esc(String(a.dashboard_path).split("\\").join("/")) + "\" target=\"_blank\" rel=\"noreferrer\">本地面板</a>");
  if(a.url)links.push(`<a href="${esc(a.url)}" target="_blank" rel="noreferrer">线上</a>`);
  if(a.local_path)links.push(`<a href="file:///${esc(String(a.local_path).replace(/\\/g,'/'))}" target="_blank" rel="noreferrer">本地</a>`);
  if(a.asset_size)links.push(`<span class="sub">${esc(a.asset_size)}${a.asset_mtime?' · '+esc(a.asset_mtime):''}</span>`);
  const linkRow=links.length?`<div class="asset-row">${links.join('<span class="sub">·</span>')}</div>`:'';
  const fld=(label,key)=>c[key]?`<div class="asset-row"><span class="asset-label">${label}</span><span>${esc(c[key])}</span></div>`:'';
  const pending=(c.pending_sources&&c.pending_sources.length)?`<div class="asset-row"><span class="asset-label">待入库</span><span>${c.pending_sources.map(x=>`<span class="asset-tag tag-pend">${esc(x)}</span>`).join(' ')}</span></div>`:'';
  const beadsRows=[];
  if(a.owner_beads)beadsRows.push(beadsRow(a.owner_beads,'owner'));
  (a.related_beads||[]).filter(id=>id!==a.owner_beads).forEach(id=>beadsRows.push(beadsRow(id,'related')));
  const beadsBlock=beadsRows.length?`<div class="asset-block"><div class="asset-head">beads</div>${beadsRows.join('')}</div>`:'';
  const manuals=(D.edges||[]).filter(e=>e.kind==='manual-covers'&&e.to===a.id).map(e=>entById[e.from]).filter(Boolean);
  const hasU=manuals.some(m=>m.manual_type==='usage'||m.manual_type==='both'),hasR=manuals.some(m=>m.manual_type==='repair'||m.manual_type==='both');
  const okfBlock=`<div class="asset-row"><span class="asset-label">OKF</span><span>使用 ${hasU?'<b class="ok">✓</b>':'<b class="no">✗</b>'} · 维修 ${hasR?'<b class="ok">✓</b>':'<b class="no">✗</b>'}</span>${manuals.length?`<a class="sub" href="#beads-manuals">${esc(manuals.map(m=>m.name).join('、'))}</a>`:''}</div>`;
  const rel=(D.edges||[]).filter(e=>(e.from===a.id||e.to===a.id)&&(e.kind==='asset-renders-capability'||e.kind==='asset-renders-system'||e.kind==='mcp-implements'||/codegraph|cbm/i.test(String(e.from||'')+String(e.to||''))));
  const relBlock=rel.length?`<div class="asset-row"><span class="asset-label">检索</span><span>${rel.map(e=>{const o=e.from===a.id?e.to:e.from;return `${esc(e.kind)} → <code>${esc(o)}</code>`}).join('；')}</span></div>`:'';
  const all=(D.edges||[]).filter(e=>e.from===a.id||e.to===a.id);
  const detail=all.length?`<div class="asset-block"><div class="asset-head">全部关系 ${all.length} 条</div>${all.map(e=>{const out=e.from===a.id;const o=out?e.to:e.from;const oe=entById[o];return `<div class="asset-row"><span class="asset-label">${esc(e.kind)}</span><span>${out?'→':'←'} <code>${esc(o)}</code>${oe&&oe.name!==o?` <span class="sub">${esc(oe.name)}</span>`:''}</span></div>`}).join('')}</div>`:`<div class="asset-row"><span class="asset-label">关系</span><span class="sub">—</span></div>`;
  return `<div class="card asset-card" data-aid="${esc(a.id)}">${title} ${numTag}${dacTag}${typeTag}${lcTag}${flag}${linkRow}${fld('数据库','database')}${fld('来源','source')}${fld('原始地址','original_url')}${fld('更新方法','update_method')}${fld('建立标准','build_standard')}${fld('精读标准','reading_standard')}${pending}${gapRow}${beadsBlock}${okfBlock}${relBlock}${detail}</div>`}
function assetCardsMarkup(pid){const all=D.entities.filter(e=>e.kind==='asset'&&e.panel===pid);
  // codex-ygjz v5.5：子域桶改为 manifest 面板内直渲（LADDERED 梯架旁路废弃——新子域名不在 topology 列，走梯子会丢 16 卡）
  // E-23 2026-08-03：database 资产按 data_asset_class（taxonomy 驱动）分组；其余按 map_subnode（85 卡守恒，仅分组轴变化）
  const DACN={'dac:tuwen':'图文创作①','dac:ruanjian':'软件开发②','dac:shijue':'视觉设计③','dac:tuxiang':'图像生成处理④','dac:shipin':'视频创作⑤','dac:zhishiku':'知识库(候选)'};
  const dacs=all.filter(e=>e.asset_type==='database'&&e.data_asset_class),others=all.filter(e=>!(e.asset_type==='database'&&e.data_asset_class));
  const groups={};others.filter(e=>e.map_subnode).forEach(e=>{(groups[e.map_subnode]=groups[e.map_subnode]||[]).push(e)});
  const without=others.filter(e=>!e.map_subnode);
  let out='';
  const dacGroups={};dacs.forEach(e=>{(dacGroups[e.data_asset_class]=dacGroups[e.data_asset_class]||[]).push(e)});
  Object.keys(dacGroups).sort().forEach(g=>{out+=`<h3>资产卡 · 数据库/${esc(DACN[g]||g)}（${dacGroups[g].length}）</h3><div class="grid asset-grid">${dacGroups[g].map(assetCard).join('')}</div>`});
  const gkeys=Object.keys(groups).sort();
  out+=gkeys.map(g=>{const t=SUBT[g]||(projectionNodes.get(g)||{}).title||g;return `<h3>资产卡 · ${esc(pid+'.'+g)}（${groups[g].length}）</h3><div class="grid asset-grid">${groups[g].map(assetCard).join('')}</div>`}).join('');
  if(without.length)out+=`<h3>${gkeys.length?'未归子域':'资产卡'}（${without.length}）</h3><div class="grid asset-grid">${without.map(assetCard).join('')}</div>`;
  return out}
['beads','hardware','search','harness','agent-hub','skill-manager','mcp-manager','provider-manager','topology','projects'].forEach(pid=>{const el=document.getElementById(pid);if(!el)return;const m=assetCardsMarkup(pid);if(m)el.insertAdjacentHTML('beforeend',m)});

const RENDERER_REGISTRY={renderSourceStrip,renderTopology,renderCounts,guardianLiveMarkup,renderTaskTable:renderTasks,renderCards:assetCardsMarkup,renderDepsTable,renderManualStrip,renderQualityStrip,renderGraph,renderAgentTopology,renderEnabledForMatrix};

// 每个面板：最左边生成分类导航栏（h3 区块 + L2 子域，DOM 序，可点跳转）
document.querySelectorAll('section.panel').forEach(panel=>{
  const entries=[];
  panel.querySelectorAll('h3, .l2-vstack > div').forEach((node,i)=>{
    const isH3=node.tagName==='H3';
    const label=isH3?node.textContent.replace(/\s+/g,' ').trim().slice(0,24):(node.querySelector('.tree-node b')||{}).textContent;
    if(!label)return;
    const id=panel.id+'-nav-'+i;node.id=id;entries.push([label,id]);
  });
  if(entries.length<2)return;
  const nav=document.createElement('div');nav.className='panel-subnav';
  nav.innerHTML=entries.map(([t,id])=>`<a href="#${id}">${esc(t)}</a>`).join('');
  const content=document.createElement('div');content.className='panel-content';
  [...panel.children].forEach(c=>{if(c.tagName!=='H2'&&!c.classList.contains('sub'))content.append(c)});
  panel.classList.add('has-subnav');
  panel.append(nav,content);
});
